<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}LinkedIn Scraper{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" crossorigin="anonymous" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet" crossorigin="anonymous" />

  <style>
    body { background-color: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: 0.03em; }
    .status-badge { font-size: 0.78rem; }
    .table th { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; color: #6c757d; }
    .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .card-header { background: #fff; font-weight: 600; border-bottom: 1px solid #e9ecef; }
    .cookie-ok    { color: #198754; }
    .cookie-partial { color: #fd7e14; }
    .cookie-invalid,
    .cookie-missing { color: #dc3545; }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('index') }}">
      <i class="bi bi-linkedin text-primary me-1"></i> SalesNav Scraper
    </a>
    <div class="ms-auto d-flex align-items-center gap-3">
      <!-- Cookie status indicator -->
      {% if cookie_status == 'ok' %}
        <span class="cookie-ok small" title="Sales Navigator cookies are present">
          <i class="bi bi-shield-check"></i> Cookies OK
        </span>
      {% elif cookie_status == 'partial' %}
        <span class="cookie-partial small" title="Regular LinkedIn cookies found but Sales Navigator cookies missing">
          <i class="bi bi-shield-exclamation"></i> Partial Cookies
        </span>
      {% else %}
        <span class="cookie-invalid small" title="linkedin_cookies.json is missing or invalid">
          <i class="bi bi-shield-x"></i> No Cookies
        </span>
      {% endif %}
    </div>
  </div>
</nav>

<!-- Main content -->
<main class="container py-4" style="max-width:1200px;">
  {% block content %}{% endblock %}
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

{% block extra_scripts %}{% endblock %}
</body>
</html>
